<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>轻奢社区 - 私信聊天</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
      --primary: #6366f1;
      --primary-light: #818cf8;
      --secondary: #a855f7;
      --accent: #ec4899;
      --dark: #1f2937;
      --light: #f9fafb;
      --gray: #6b7280;
      --card-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.15);
      --hover-shadow: 0 20px 40px -5px rgba(99, 102, 241, 0.25);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #f8faff 100%);
      min-height: 100vh;
      color: var(--dark);
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    .header {
      background: white;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 主布局：左侧会话 + 右侧聊天 */
    .layout {
      display: flex;
      max-width: 1200px;
      margin: 20px auto;
      flex: 1;
      height: calc(100vh - 110px);
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }

    /* 左侧：私信列表 */
    .sidebar {
      width: 320px;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    .sidebar-head {
      padding: 20px;
      border-bottom: 1px solid #f3f4f6;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .search-bar {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 15px 10px 40px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      outline: none;
      font-size: 14px;
      background: #f9fafb;
    }

    .search-input:focus {
      border-color: var(--primary-light);
    }

    .search-bar i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
    }

    /* 私信会话列表 */
    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .chat-item:hover {
      background: #f9fafb;
    }

    .chat-item.active {
      background: #eef2ff;
      border-left: 4px solid var(--primary);
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid white;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .chat-last-msg {
      font-size: 13px;
      color: var(--gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      font-size: 11px;
      color: var(--gray);
      position: absolute;
      right: 20px;
      top: 18px;
    }

    .unread-badge {
      min-width: 18px;
      height: 18px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      position: absolute;
      right: 20px;
      bottom: 18px;
    }

    /* 右侧：聊天区域 */
    .chat-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 聊天对象头部 */
    .chat-header {
      padding: 16px 25px;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      z-index: 2;
    }

    .chat-header-name {
      font-weight: 600;
      font-size: 16px;
    }

    .chat-header-status {
      font-size: 12px;
      color: #10b981;
    }

    /* 消息内容区 */
    .message-area {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      background: #fafbff;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 消息气泡 */
    .msg {
      max-width: 70%;
      animation: fadeIn 0.3s ease;
    }

    .msg.in {
      align-self: flex-start;
    }

    .msg.out {
      align-self: flex-end;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .msg.in .msg-bubble {
      background: white;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 6px;
    }

    .msg.out .msg-bubble {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      border-bottom-right-radius: 6px;
    }

    .msg-time {
      font-size: 11px;
      color: var(--gray);
      margin-top: 4px;
      text-align: right;
    }

    /* 输入框 */
    .input-area {
      padding: 15px 20px;
      border-top: 1px solid #f3f4f6;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: white;
    }

    .msg-input {
      flex: 1;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 14px 18px;
      outline: none;
      resize: none;
      height: 50px;
      max-height: 120px;
      font-size: 14px;
    }

    .send-btn {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
      transition: var(--transition);
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(99,102,241,0.25);
    }

    /* 空状态 */
    .empty-chat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--gray);
    }

    .empty-chat i {
      font-size: 50px;
      margin-bottom: 15px;
      opacity: 0.4;
    }

    /* 动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .sidebar { width: 100%; }
      .chat-box { display: none; }
      .layout { height: calc(100vh - 110px); }
    }
  </style>
</head>

<body>

<!-- 顶部导航 -->
<div class="header">
  <div class="nav">
    <div class="logo">
      <i class="fa fa-envelope"></i> 私信聊天
    </div>
  </div>
</div>

<!-- 主布局 -->
<div class="layout">
  <!-- 左侧：私信会话列表 -->
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">我的私信</div>
      <div class="search-bar">
        <i class="fa fa-search"></i>
        <input type="text" class="search-input" placeholder="搜索联系人...">
      </div>
    </div>

    <div class="chat-list">
      <div class="chat-item active">
        <img src="https://picsum.photos/200/200?1" class="avatar">
        <div class="chat-info">
          <div class="chat-name">辰星学长</div>
          <div class="chat-last-msg">你好呀，最近学习怎么样？</div>
        </div>
        <div class="chat-time">10:30</div>
      </div>

      <div class="chat-item">
        <img src="https://picsum.photos/200/200?2" class="avatar">
        <div class="chat-info">
          <div class="chat-name">前端大神</div>
          <div class="chat-last-msg">谢谢分享，非常有用！</div>
        </div>
        <div class="chat-time">昨天</div>
        <div class="unread-badge">2</div>
      </div>

      <div class="chat-item">
        <img src="https://picsum.photos/200/200?3" class="avatar">
        <div class="chat-info">
          <div class="chat-name">萌新小白</div>
          <div class="chat-last-msg">大佬可以教教我吗？</div>
        </div>
        <div class="chat-time">3天前</div>
      </div>
    </div>
  </div>

  <!-- 右侧：聊天窗口 -->
  <div class="chat-box">
    <div class="chat-header">
      <img src="https://picsum.photos/200/200?1" class="avatar" style="width: 40px; height: 40px;">
      <div>
        <div class="chat-header-name">辰星学长</div>
        <div class="chat-header-status"><i class="fa fa-circle"></i> 在线</div>
      </div>
    </div>

    <div class="message-area" id="msgArea">
      <div class="msg in">
        <div class="msg-bubble">你好呀！我是辰星学长 😊</div>
        <div class="msg-time">10:25</div>
      </div>

      <div class="msg out">
        <div class="msg-bubble">你好！我想请教一些前端问题</div>
        <div class="msg-time">10:28</div>
      </div>

      <div class="msg in">
        <div class="msg-bubble">没问题，尽管问！我会尽力解答</div>
        <div class="msg-time">10:30</div>
      </div>
    </div>

    <div class="input-area">
      <textarea class="msg-input" id="msgInput" placeholder="输入消息..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn">
        <i class="fa fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>

<script>
  const msgArea = document.getElementById('msgArea');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatItems = document.querySelectorAll('.chat-item');

  // 切换会话
  chatItems.forEach(item => {
    item.addEventListener('click', () => {
      chatItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
    });
  });

  // 发送消息
  function sendMsg() {
    const text = msgInput.value.trim();
    if (!text) return;

    // 添加自己的消息
    const div = document.createElement('div');
    div.className = 'msg out';
    div.innerHTML = `
        <div class="msg-bubble">${text}</div>
        <div class="msg-time">${new Date().getHours()}:${String(new Date().getMinutes()).padStart(2, '0')}</div>
      `;
    msgArea.appendChild(div);
    msgInput.value = '';
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  sendBtn.addEventListener('click', sendMsg);
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });
</script>
</body>
</html>
