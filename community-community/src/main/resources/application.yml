server:
  port: 8091

spring:
  application:
    name: community-community
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/community_content?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: community-platform-secret-key-must-be-at-least-256-bits-long-for-hs256

logging:
  level:
    com.community.community.mapper: DEBUG

# 与 community-file 的 community.file.gc.internal-token 保持一致；未启用不影响发帖
community:
  file-gc:
    enabled: false
    internal-token: ${FILE_GC_INTERNAL_TOKEN:}
    # min-age-hours: 24
    # cron: "0 0 0 * * ?"
